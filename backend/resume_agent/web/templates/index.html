<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求职投递分析</title>
<style>
  :root {
    --ink: #172033;
    --muted: #667085;
    --line: #e5e9f0;
    --surface: #ffffff;
    --canvas: #f5f7fb;
    --navy: #173b73;
    --blue: #3478f6;
    --cyan: #39a7c8;
    --green: #278f67;
    --amber: #d58a20;
    --red: #c4544d;
    --purple: #7656b8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; line-height: 1.55; }
  button, a { font: inherit; }
  .hero { color: white; background: linear-gradient(118deg, #102f61 0%, #1d4f8e 58%, #246a9a 100%); padding: 2.25rem max(1.25rem, calc((100vw - 1180px) / 2)); }
  .eyebrow { margin: 0 0 0.35rem; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; opacity: 0.68; }
  h1 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.55rem); line-height: 1.18; }
  .hero-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  .hero-copy { margin: 0.55rem 0 1.35rem; max-width: 720px; font-size: 0.93rem; opacity: 0.82; }
  .sync-strip { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; padding: 0.72rem 0.85rem; border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; background: rgba(255,255,255,0.09); backdrop-filter: blur(8px); }
  .sync-dot { width: 0.58rem; height: 0.58rem; border-radius: 50%; flex: 0 0 auto; background: #b8c1d1; box-shadow: 0 0 0 4px rgba(255,255,255,0.08); }
  .sync-dot.ok { background: #5de0a4; }
  .sync-dot.loading { background: #ffd36a; animation: pulse 1.2s infinite; }
  .sync-dot.error { background: #ff837c; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  #sync-summary { flex: 1 1 360px; min-width: 220px; font-size: 0.86rem; }
  .action { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 0.42rem 0.78rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); color: white; background: rgba(255,255,255,0.1); text-decoration: none; cursor: pointer; }
  .action:hover { background: rgba(255,255,255,0.17); }
  .action:disabled { opacity: 0.45; cursor: not-allowed; }
  main { width: min(1180px, calc(100% - 2rem)); margin: -0.35rem auto 2.5rem; }
  .system-banner { display: none; margin: 1rem 0; padding: 0.9rem 1rem; border: 1px solid #f1bbb7; border-radius: 10px; color: #9e342e; background: #fff0ef; }
  .notice { display: none; margin: 1rem 0 0; padding: 0.75rem 0.9rem; border-radius: 10px; font-size: 0.85rem; }
  .notice.error { display: block; color: #9e342e; background: #fff0ef; border: 1px solid #f1bbb7; }
  .notice.ok { display: block; color: #176846; background: #eaf8f1; border: 1px solid #bde6d1; }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.85rem; margin: 1.25rem 0; }
  .metric, .card { border: 1px solid var(--line); background: var(--surface); box-shadow: 0 8px 24px rgba(25,49,84,0.05); }
  .metric { border-radius: 14px; padding: 1.05rem 1.1rem; }
  .metric-value { font-size: 1.85rem; font-weight: 780; line-height: 1.1; color: var(--navy); }
  .metric-label { margin-top: 0.3rem; color: var(--muted); font-size: 0.82rem; }
  .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
  .card { border-radius: 16px; padding: 1.25rem; }
  .card h2 { margin: 0; font-size: 1.03rem; }
  .card-subtitle { margin: 0.25rem 0 1.05rem; color: var(--muted); font-size: 0.78rem; }
  .stage-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 32px; align-items: center; gap: 0.65rem; margin: 0.72rem 0; }
  .stage-name { color: #344054; font-size: 0.82rem; }
  .bar-track { height: 11px; overflow: hidden; border-radius: 999px; background: #edf1f6; }
  .bar-fill { height: 100%; min-width: 3px; border-radius: inherit; transition: width 0.35s ease; }
  .stage-count { text-align: right; font-weight: 750; font-size: 0.83rem; }
  .priority-row { margin: 0.72rem 0 0.95rem; }
  .priority-label { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 0.35rem; color: #344054; font-size: 0.8rem; }
  .stack { display: flex; height: 14px; overflow: hidden; border-radius: 999px; background: #edf1f6; }
  .segment { min-width: 0; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 0.85rem; margin-top: 1rem; color: var(--muted); font-size: 0.74rem; }
  .legend span::before { content: ""; display: inline-block; width: 0.55rem; height: 0.55rem; margin-right: 0.32rem; border-radius: 2px; vertical-align: -0.03rem; background: var(--legend-color); }
  .focus-card { grid-column: 1 / -1; }
  .focus-list { display: grid; gap: 0.65rem; }
  .focus-item { display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(220px, 0.7fr); gap: 0.85rem; align-items: center; padding: 0.88rem; border: 1px solid var(--line); border-radius: 12px; background: #fbfcfe; }
  .focus-rank { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; color: var(--navy); background: #eaf1fc; font-weight: 800; }
  .focus-title { font-size: 0.9rem; font-weight: 720; overflow-wrap: anywhere; }
  .focus-meta { display: flex; flex-wrap: wrap; gap: 0.38rem; margin-top: 0.35rem; color: var(--muted); font-size: 0.75rem; }
  .pill { padding: 0.08rem 0.42rem; border-radius: 999px; background: #eef2f7; }
  .pill.high { color: #9e342e; background: #fff0ef; }
  .focus-action { padding-left: 0.85rem; border-left: 3px solid #cfe0f8; color: #344054; font-size: 0.82rem; }
  .focus-action strong { display: block; margin-bottom: 0.18rem; color: var(--navy); font-size: 0.72rem; letter-spacing: 0.04em; }
  .empty { padding: 1.5rem; text-align: center; color: var(--muted); font-size: 0.85rem; }
  footer { margin-top: 1rem; text-align: center; color: var(--muted); font-size: 0.74rem; }
  @media (max-width: 800px) {
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dashboard-grid { grid-template-columns: 1fr; }
    .focus-item { grid-template-columns: 36px minmax(0, 1fr); }
    .focus-action { grid-column: 2; }
  }
  @media (max-width: 480px) {
    .hero { padding: 1.5rem 1rem 1.75rem; }
    main { width: min(100% - 1rem, 1180px); }
    .metrics { gap: 0.5rem; }
    .metric, .card { border-radius: 12px; }
    .metric { padding: 0.85rem; }
    .metric-value { font-size: 1.55rem; }
    .stage-row { grid-template-columns: 78px minmax(0, 1fr) 26px; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-title-row">
    <div>
      <h1>求职投递分析</h1>
      <p class="hero-copy">投递进展与优先级概览</p>
    </div>
    <nav style="display:flex;gap:0.55rem;flex-wrap:wrap;justify-content:flex-end" aria-label="页面导航">
      <a class="action" href="/job-analysis">岗位分析</a>
      <a class="action" href="/project-review">项目复盘</a>
    </nav>
  </div>
  <div class="sync-strip">
    <span id="sync-dot" class="sync-dot loading" aria-hidden="true"></span>
    <span id="sync-summary">正在读取本地投递数据…</span>
    <button id="sync-button" class="action" type="button">刷新</button>
    <a id="feishu-link" class="action" href="#" target="_blank" rel="noopener noreferrer" style="display:none">打开飞书</a>
  </div>
</header>

<main>
  <div id="system-compatibility" class="system-banner" role="alert"></div>
  <div id="sync-notice" class="notice" role="status"></div>

  <section class="metrics" aria-label="投递核心指标">
    <article class="metric"><div id="metric-active" class="metric-value">—</div><div class="metric-label">进行中</div></article>
    <article class="metric"><div id="metric-assessment" class="metric-value">—</div><div class="metric-label">笔试阶段</div></article>
    <article class="metric"><div id="metric-high" class="metric-value">—</div><div class="metric-label">高优先级进行中</div></article>
    <article class="metric"><div id="metric-planning" class="metric-value">—</div><div class="metric-label">待投递</div></article>
  </section>

  <section class="dashboard-grid">
    <article class="card">
      <h2>投递状态分布</h2>
      <p class="card-subtitle">展示当前状态，不把“暂时搁置”误算为待规划。</p>
      <div id="stage-chart" class="empty">等待飞书数据…</div>
    </article>

    <article class="card">
      <h2>优先级 × 阶段</h2>
      <p class="card-subtitle">识别投递资源集中在哪里，不计算尚无历史依据的转化率。</p>
      <div id="priority-chart" class="empty">等待飞书数据…</div>
      <div class="legend">
        <span style="--legend-color:#c4544d">高</span>
        <span style="--legend-color:#d58a20">中</span>
        <span style="--legend-color:#6d91be">低</span>
        <span style="--legend-color:#b8c1d1">未设置</span>
      </div>
    </article>

    <article class="card focus-card">
      <h2>今日关注</h2>
      <p class="card-subtitle">最多5条。笔试与面试优先，其次是高优先级进行中和高优先级待投递。</p>
      <div id="focus-list" class="empty">等待飞书数据…</div>
    </article>
  </section>

  <footer>只读分析 · 不回写飞书 · 不调用 LLM · 详细记录请在飞书原表中查看</footer>
</main>

<script>
const API = '/api';
const EXPECTED_API_CONTRACT = '2026-08-26.2';
const stageColors = {
  planning: '#6d91be', screening: '#3478f6', assessment: '#7656b8',
  interview: '#39a7c8', shelved: '#a7afb9', closed: '#c4544d', other: '#d58a20'
};
const priorityColors = {'高': '#c4544d', '中': '#d58a20', '低': '#6d91be', '未设置': '#b8c1d1'};
let lastSnapshot = null;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]));
}

async function api(path, options = {}) {
  const response = await fetch(API + path, options);
  if (!response.ok) {
    const error = await response.json().catch(() => ({detail: response.statusText}));
    if (response.status === 404 && error.detail === 'Not Found') {
      throw new Error('页面与后台版本不一致，请重新启动投递看板。');
    }
    const detail = error.detail;
    throw new Error(typeof detail === 'object' ? (detail.message || detail.code) : (detail || '请求失败'));
  }
  return response.json();
}

function formatSyncTime(value) {
  if (!value) return '时间未知';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '时间未知';
  return new Intl.DateTimeFormat('zh-CN', {
    month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
  }).format(date);
}

function setSyncState(kind, text) {
  document.getElementById('sync-dot').className = `sync-dot ${kind}`;
  document.getElementById('sync-summary').textContent = text;
}

function showNotice(text = '', kind = '') {
  const notice = document.getElementById('sync-notice');
  notice.textContent = text;
  notice.className = kind ? `notice ${kind}` : 'notice';
}

function renderMetrics(metrics = {}) {
  document.getElementById('metric-active').textContent = metrics.active ?? '—';
  document.getElementById('metric-assessment').textContent = metrics.assessment ?? '—';
  document.getElementById('metric-high').textContent = metrics.active_high_priority ?? '—';
  document.getElementById('metric-planning').textContent = metrics.planning ?? '—';
}

function renderStages(stages = []) {
  const target = document.getElementById('stage-chart');
  if (!stages.length) { target.className = 'empty'; target.textContent = '暂无可展示的状态数据。'; return; }
  const maximum = Math.max(...stages.map(item => item.count), 1);
  target.className = '';
  target.innerHTML = stages.map(item => `
    <div class="stage-row">
      <span class="stage-name">${escapeHtml(item.label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3, item.count / maximum * 100)}%;background:${stageColors[item.key] || stageColors.other}"></div></div>
      <span class="stage-count">${escapeHtml(item.count)}</span>
    </div>`).join('');
}

function renderPriorities(rows = []) {
  const target = document.getElementById('priority-chart');
  if (!rows.length) { target.className = 'empty'; target.textContent = '暂无可展示的优先级数据。'; return; }
  target.className = '';
  target.innerHTML = rows.map(row => {
    const total = Object.values(row.counts || {}).reduce((sum, count) => sum + count, 0) || 1;
    const summary = ['高', '中', '低'].filter(name => row.counts?.[name]).map(name => `${name}${row.counts[name]}`).join(' · ');
    const segments = ['高', '中', '低', '未设置'].filter(name => row.counts?.[name]).map(name =>
      `<span class="segment" title="${escapeHtml(name)} ${escapeHtml(row.counts[name])}" style="width:${row.counts[name] / total * 100}%;background:${priorityColors[name]}"></span>`
    ).join('');
    return `<div class="priority-row"><div class="priority-label"><span>${escapeHtml(row.label)}</span><span>${escapeHtml(summary || '未设置')}</span></div><div class="stack">${segments}</div></div>`;
  }).join('');
}

function renderFocus(items = []) {
  const target = document.getElementById('focus-list');
  if (!items.length) { target.className = 'empty'; target.textContent = '当前没有需要优先处理的记录。'; return; }
  target.className = 'focus-list';
  target.innerHTML = items.map((item, index) => `
    <article class="focus-item">
      <div class="focus-rank">${index + 1}</div>
      <div>
        <div class="focus-title">#${escapeHtml(item.sequence)} · ${escapeHtml(item.company || '公司待补充')} · ${escapeHtml(item.role || '岗位待补充')}</div>
        <div class="focus-meta">
          <span class="pill ${item.priority === '高' ? 'high' : ''}">${escapeHtml(item.priority || '未设置')}优先级</span>
          <span class="pill">${escapeHtml(item.status || '状态未知')}</span>
          <span>${escapeHtml(item.reason)}</span>
        </div>
      </div>
      <div class="focus-action"><strong>建议动作</strong>${escapeHtml(item.action)}</div>
    </article>`).join('');
}

function renderDashboard(sync) {
  lastSnapshot = sync;
  const link = document.getElementById('feishu-link');
  if (sync.document_url) { link.href = sync.document_url; link.style.display = 'inline-flex'; }
  else { link.style.display = 'none'; }
  const analysis = sync.analysis;
  const dashboard = analysis?.dashboard;
  if (!sync.connected || !analysis?.ready || !dashboard) {
    setSyncState(sync.configured ? 'error' : 'error', sync.configured ? '尚无可用投递数据，请点击刷新重试。' : '飞书尚未完成本地授权配置。');
    renderMetrics(); renderStages(); renderPriorities(); renderFocus();
    return;
  }
  setSyncState('ok', `已同步 ${analysis.total_records} 条 · 最近成功 ${formatSyncTime(sync.last_success_at)}`);
  renderMetrics(dashboard.metrics);
  renderStages(dashboard.stage_counts);
  renderPriorities(dashboard.priority_by_stage);
  renderFocus(dashboard.focus_items);
}

async function verifyApiCompatibility() {
  const banner = document.getElementById('system-compatibility');
  try {
    const response = await fetch(`${API}/meta`, {cache: 'no-store'});
    if (!response.ok) throw new Error('API metadata unavailable');
    const metadata = await response.json();
    if (metadata.contract_version !== EXPECTED_API_CONTRACT) throw new Error('API contract mismatch');
    return true;
  } catch (_) {
    banner.textContent = '页面与后台版本不一致。请关闭后重新启动“投递看板”，不要继续同步数据。';
    banner.style.display = 'block';
    document.getElementById('sync-button').disabled = true;
    setSyncState('error', '当前页面不可用，请重新启动投递看板。');
    return false;
  }
}

async function loadLocalSnapshot() {
  const response = await api('/feishu-sync');
  renderDashboard(response.sync);
  return response.sync;
}

async function syncFromFeishu(manual = false) {
  const button = document.getElementById('sync-button');
  button.disabled = true;
  setSyncState('loading', manual ? '正在刷新飞书数据…' : '正在后台检查飞书更新…');
  if (manual) showNotice();
  const controller = new AbortController();
  const timeout = window.setTimeout(() => controller.abort(), 20000);
  try {
    const response = await api('/feishu-sync', {method: 'POST', signal: controller.signal});
    renderDashboard(response.sync);
    if (manual) showNotice(response.result.changed ? '已读取飞书最新内容。' : '飞书内容没有变化。', 'ok');
  } catch (error) {
    if (lastSnapshot?.analysis?.ready) {
      renderDashboard(lastSnapshot);
      setSyncState('error', `同步失败，继续使用上次成功的 ${lastSnapshot.analysis.total_records} 条记录。`);
    } else {
      setSyncState('error', '同步失败，当前没有可用的本地数据。');
    }
    if (manual) {
      showNotice(error.name === 'AbortError' ? '同步超过20秒，已停止等待。' : `同步失败：${error.message}`, 'error');
    }
  } finally {
    window.clearTimeout(timeout);
    button.disabled = false;
  }
}

async function initializePage() {
  if (!await verifyApiCompatibility()) return;
  try {
    const snapshot = await loadLocalSnapshot();
    if (snapshot.configured) await syncFromFeishu(false);
  } catch (error) {
    setSyncState('error', `读取本地数据失败：${error.message}`);
  }
}

document.getElementById('sync-button').addEventListener('click', () => syncFromFeishu(true));
initializePage();
</script>
</body>
</html>
