name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build public Docker image
        run: docker build --tag truthful-resume-agent:ci .

      - name: Validate public data inside Docker image
        run: docker run --rm truthful-resume-agent:ci python backend/run_cli.py validate

      - name: Test outcome tracker inside Docker image
        run: docker run --rm truthful-resume-agent:ci python -m backend.resume_agent.test_outcomes

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate public example data
        run: python backend/run_cli.py validate

      - name: Run end-to-end smoke suite
        run: python -m backend.resume_agent.smoke_test

      - name: Run conversational Agent tests
        run: python -m backend.resume_agent.agent.test_agent

      - name: Run Agent runtime and API tests
        run: python -m backend.resume_agent.agent.test_runtime

      - name: Run local outcome tracker tests
        run: python -m backend.resume_agent.test_outcomes

      - name: Run read-only Feishu sync and ledger analysis tests
        run: python -m backend.resume_agent.test_feishu_sync

      - name: Run Feishu application-link tests
        run: python -m backend.resume_agent.test_feishu_links

      - name: Run deterministic job-analysis tests
        run: python -m backend.resume_agent.test_job_analysis

      - name: Run matcher cohort and label-contract tests
        run: python -m backend.resume_agent.test_matcher_eval

      - name: Run context-strategy evaluation tests
        run: python -m backend.resume_agent.test_context_strategy_eval

      - name: Run fixed Agent regression cases
        run: python -m backend.resume_agent.agent_eval

      - name: Run offline Agent control-path demo
        run: python -m backend.resume_agent.agent_demo

      - name: Rebuild matcher evaluation
        run: python -m backend.resume_agent.eval_matchers --output /tmp/matcher_report.md

      - name: Run retrieval sanity check
        run: python -m backend.resume_agent.rag_eval

      - name: Check installed dependencies
        run: python -m pip check
